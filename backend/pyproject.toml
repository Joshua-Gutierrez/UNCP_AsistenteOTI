[project]
name = "backend"
version = "0.1.0"
description = "UNCP Asistente Virtual API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "aiomysql>=0.2.0",
    "cryptography>=42.0.0",
    "bcrypt>=4.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pydantic-settings>=2.3.0",
    "pyjwt>=2.8.0",
    "sqlmodel>=0.0.42",
    "uuid7>=0.1.0",
    "uvicorn>=0.52.4",
    "paddlepaddle>=2.6.1",
    "paddleocr>=2.8.0,<2.9.0",
    "opencv-python-headless>=4.9",
    "numpy>=1.26,<2.0.0",
    "aiosmtplib>=3.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv-win"
